name: AppGroupProbe
options:
  bundleIdPrefix: app.yam53
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Единая конфигурация идентичности (общая для всех таргетов).
# PROBE_APP_GROUP_ID — единственная точка выбора App Group; значение
# подставляется в Info.plist каждого bundle (ключ AppGroupIdentifier)
# на этапе сборки. Группа НЕ вычисляется из Bundle ID.
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    # Сборка всегда идёт без подписи — финальную подпись ставит GBox.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    PROBE_APP_GROUP_ID: group.c2fefdd0db2e255e.1

targets:
  AppGroupProbe:
    type: application
    platform: iOS
    sources:
      - path: AppGroupProbe
      - path: Shared
    dependencies:
      - target: AppGroupProbeWidget
        embed: true
    info:
      path: AppGroupProbe/Info.plist
      properties:
        CFBundleDisplayName: AppGroupProbe
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        AppGroupIdentifier: "$(PROBE_APP_GROUP_ID)"
    entitlements:
      path: AppGroupProbe/AppGroupProbe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.c2fefdd0db2e255e.1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yam53.taro5888

  AppGroupProbeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AppGroupProbeWidget
      - path: Shared
    info:
      path: AppGroupProbeWidget/Info.plist
      properties:
        CFBundleDisplayName: AppGroupProbe
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupIdentifier: "$(PROBE_APP_GROUP_ID)"
    entitlements:
      path: AppGroupProbeWidget/AppGroupProbeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.c2fefdd0db2e255e.1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yam53.taro5888.widget
